services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: lab-app-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: lab_books
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super_secret_jwt_key_which_is_long_enough_123456
      SESSION_SECRET: super_long_session_secret_key_1234567890
    command: npm run dev
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    environment:
      MYSQL_DATABASE: lab_books
    ports:
      - "3306:3306"

  redis:
    ports:
      - "6379:6379"
